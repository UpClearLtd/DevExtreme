name: Upclear DevExtreme package v1

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18  # Using LTS version for better compatibility
          cache: 'npm'

      - name: Clean up previous installations
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install dependencies using npm
        run: npm install --legacy-peer-deps

      - name: Build devextreme repo
        run: npm run all:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devextreme-npm-packages
          path: ./artifacts/npm/devextreme-*.tgz
          retention-days: 1
