name: Upclear DevExtreme package v1

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9      # ou omet si défini par "packageManager" dans package.json
          standalone: true
          dest: ~/setup-pnpm
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Ensure pnpm is on PATH
        run: |
          echo "::add-path::${HOME}/setup-pnpm/node_modules/.bin"
          pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Build devextreme repo
        run: pnpm test -d artifacts || pnpm run all:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devextreme-npm-packages
          path: ./artifacts/npm/devextreme-*.tgz
          retention-days: 1
